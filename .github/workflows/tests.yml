# SPDX-License-Identifier: Apache-2.0
# Lint and test the Python golden model on every push and pull request, on
# x86 Linux, ARM Linux, and ARM macOS (different SIMD code paths in torch),
# and the RTL (lint, synthesis, simulation) on x86 Linux. The exhaustive
# tests (minutes) run on pushes to main and on demand; the RTL's run locally.
name: tests

on:
  push:
    branches: [main]   # branches with a PR are tested by pull_request instead
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest

  rtl:
    runs-on: ubuntu-24.04
    env:
      CABOSSE_REQUIRE_RTL: "1"  # a missing tool fails instead of skipping
      MAKEFLAGS: CXX=g++-14 LINK=g++-14  # the drivers' <print> needs GCC 14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/cache@v6
        with:
          path: .tools/oss-cad-suite
          key: oss-cad-suite-${{ hashFiles('scripts/get_rtl_tools.sh') }}
      - run: scripts/get_rtl_tools.sh
      - run: pip install -r requirements.txt
      - run: pytest verif

  exhaustive:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m slow
