# Tool configuration only; Cabosse is not an installable Python package.

[tool.pytest.ini_options]
testpaths = ["model/tests"]
pythonpath = ["model", "model/tests"]
markers = ["slow: exhaustive tests that take minutes (run with: pytest -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]
